[project]
name = "learnkb"
version = "0.1.0"
description = "Local learning tool: ingest PDFs into an LLM-maintained wiki and curriculum"
requires-python = ">=3.11,<3.13"
dependencies = [
    "docling>=2.0",
    "pyyaml>=6.0",
    "markdown>=3.5",
    "pygments>=2.17",
]

[project.scripts]
learnkb-ingest = "learnkb.ingest:main"
learnkb-check = "learnkb.check:main"
learnkb-site = "learnkb.site:main"
learnkb-learner = "learnkb.learner:main"
learnkb-admin = "learnkb.admin:main"
learnkb-serve = "learnkb.serve:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/learnkb"]
