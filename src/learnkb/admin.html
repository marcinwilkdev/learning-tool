<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Knowledge base admin</title>
<style>
:root {
  --bg: #fbfaf7; --surface: #fff; --surface-2: #f3f1ec; --text: #1d1c1a; --muted: #6b6760;
  --border: #e4e0d8; --accent: #c2410c; --accent-soft: #fdeee6; --good: #15803d; --good-soft: #e7f5ec;
  --warn: #b45309; --warn-soft: #fdf4e3; --bad: #b91c1c; --bad-soft: #fdeaea; --note: #3b5bab;
  --note-soft: #eef2fb; --radius: 12px;
  --font: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
  --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #161513; --surface: #1f1e1b; --surface-2: #2a2825; --text: #ece9e2; --muted: #a39e94;
    --border: #36332e; --accent: #fb923c; --accent-soft: #3a2418; --good: #4ade80; --good-soft: #17301f;
    --warn: #fbbf24; --warn-soft: #33280f; --bad: #f87171; --bad-soft: #3a1a1a; --note: #9db4f0;
    --note-soft: #1c2436; color-scheme: dark;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 var(--font); }
main { max-width: 1200px; margin: 0 auto; padding: 24px 16px 64px; }
h1 { font-size: 22px; margin: 0; }
h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 32px 0 12px; }
code, .mono { font-family: var(--mono); font-size: 12.5px; }
.muted { color: var(--muted); }
header { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; }
header .spacer { flex: 1; }
.chip { max-width: 100%; overflow: hidden; text-overflow: ellipsis; display: inline-flex; align-items: center; gap: 6px; padding: 2px 10px; border-radius: 99px;
  background: var(--surface-2); border: 1px solid var(--border); font-size: 13px; white-space: nowrap; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
.live .dot { background: var(--good); animation: pulse 2s infinite; }
.offline .dot { background: var(--bad); }
@keyframes pulse { 50% { opacity: .35; } }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; }

button.chip { font: inherit; font-size: 13px; color: var(--text); cursor: pointer; }

/* current step */
.now { margin-top: 20px; }
.stepper { display: flex; gap: 4px; margin: 12px 0 10px; flex-wrap: wrap; }
.stepper span { flex: 1 1 80px; text-align: center; font-size: 12px; padding: 6px 4px; border-radius: 6px;
  background: var(--surface-2); color: var(--muted); }
.stepper .past { background: var(--good-soft); color: var(--good); }
.stepper .current { background: var(--accent); color: #fff; font-weight: 600; }
.now-line { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: baseline; }
.now-line strong { font-size: 17px; }

/* tiles */
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 12px; }
.tile .n { font-size: 28px; font-weight: 650; font-variant-numeric: tabular-nums; line-height: 1.2; }
.tile .label { font-size: 13px; color: var(--muted); }
.tile .sub { font-size: 12px; color: var(--muted); margin-top: 2px; }
.bar { height: 4px; background: var(--surface-2); border-radius: 2px; margin-top: 8px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--accent); transition: width .4s; }
.tile.bad .n { color: var(--bad); }
.tile.ok .n { color: var(--good); }

/* documents */
.doc + .doc { margin-top: 12px; }
.doc-head { display: flex; flex-wrap: wrap; gap: 8px; align-items: baseline; }
.doc-head strong { font-size: 16px; margin-right: 4px; }
.badge { font-size: 12px; padding: 1px 8px; border-radius: 99px; background: var(--surface-2); color: var(--muted); }
.badge.yes { background: var(--good-soft); color: var(--good); }
.badge.now { background: var(--accent-soft); color: var(--accent); }
.parts { display: grid; grid-template-columns: repeat(auto-fill, minmax(46px, 1fr)); gap: 4px; margin: 12px 0 6px; }
.part { position: relative; height: 40px; border-radius: 6px; background: var(--surface-2); overflow: hidden;
  border: 2px solid transparent; font-size: 11px; display: flex; align-items: flex-end; justify-content: center; }
.part .fill { position: absolute; inset: auto 0 0 0; background: var(--accent); opacity: .55; transition: height .4s; }
.part span { position: relative; padding-bottom: 2px; font-variant-numeric: tabular-nums; }
.part.read { border-color: var(--good); }
.part.reading { border-color: var(--accent); animation: pulse 1.5s infinite; }
.part.skipped { border: 2px dashed var(--border); background: transparent; color: var(--muted); }
.part.skipped .fill { display: none; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 12px; color: var(--muted); }
.legend i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; vertical-align: -2px; margin-right: 4px; }

/* upload */
.drop { border-style: dashed; margin-bottom: 12px; text-align: center; transition: background .2s, border-color .2s; }
.drop.over { border-color: var(--accent); background: var(--accent-soft); }
.linkbtn { font: inherit; color: var(--accent); background: none; border: 0; padding: 0; cursor: pointer; text-decoration: underline; }
.uploads { list-style: none; margin: 0; padding: 0; font-size: 13px; text-align: left; }
.uploads:not(:empty) { margin-top: 10px; }
.uploads li { padding: 3px 0; border-top: 1px solid var(--border); word-break: break-word; }
.uploads .ok { color: var(--good); }
.uploads .bad { color: var(--bad); }

/* curriculum */
.module { display: grid; grid-template-columns: 200px 1fr; gap: 12px; padding: 10px 0; border-top: 1px solid var(--border); }
.module:first-child { border-top: 0; padding-top: 0; }
.module .title { font-weight: 600; font-size: 14px; }
.topics { display: flex; flex-wrap: wrap; gap: 6px; }
.topic { font-size: 12.5px; padding: 3px 9px; border-radius: 6px; border: 1px solid var(--border); background: var(--surface-2); }
.topic.page { background: var(--note-soft); border-color: transparent; color: var(--note); }
.topic.lesson { background: var(--good-soft); border-color: transparent; color: var(--good); }
.topic.quiz { background: var(--good); border-color: transparent; color: var(--surface); }
.topic.missing { border-style: dashed; color: var(--bad); background: transparent; }
.topic.flash { animation: flash 1.2s; }
@keyframes flash { 0% { box-shadow: 0 0 0 3px var(--accent); } 100% { box-shadow: 0 0 0 0 transparent; } }

/* feeds */
.cols { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.feed { list-style: none; margin: 0; padding: 0; max-height: 460px; overflow: auto; }
.feed li { display: grid; grid-template-columns: 88px 1fr; gap: 8px; padding: 5px 0; border-top: 1px solid var(--border); font-size: 13px; }
.feed li:first-child { border-top: 0; }
.feed time { color: var(--muted); font-variant-numeric: tabular-nums; font-size: 12px; }
.feed .phase { font-size: 11px; font-weight: 600; text-transform: uppercase; color: var(--accent); margin-right: 6px; }
.feed .new { color: var(--good); font-size: 11px; font-weight: 600; margin-right: 6px; }
.feed li.fresh { animation: flash-bg 2s; }
@keyframes flash-bg { from { background: var(--accent-soft); } }
.issues { list-style: none; margin: 0; padding: 0; max-height: 460px; overflow: auto; font-size: 13px; }
.issues li { padding: 4px 0 4px 10px; border-left: 3px solid var(--warn); margin: 4px 0; word-break: break-word; }
.issues li.error { border-color: var(--bad); }
.tabs { display: flex; gap: 6px; margin-bottom: 8px; }
.tabs button { font: inherit; font-size: 13px; padding: 3px 10px; border-radius: 6px; border: 1px solid var(--border);
  background: var(--surface-2); color: var(--text); cursor: pointer; }
.tabs button[aria-pressed="true"] { background: var(--text); color: var(--bg); }
.empty { color: var(--muted); font-size: 14px; padding: 8px 0; }
.failure { background: var(--bad-soft); color: var(--bad); white-space: pre-wrap; margin-top: 16px; }
@media (max-width: 760px) {
  .cols { grid-template-columns: 1fr; }
  .module { grid-template-columns: 1fr; gap: 6px; }
}
</style>
</head>
<body>
<main>
  <header>
    <h1 data-i18n="title">Knowledge base admin</h1>
    <span class="chip" id="branch" hidden></span>
    <span class="spacer"></span>
    <button type="button" class="chip" id="lang"></button>
    <a class="chip" href="../" target="learnkb-site" data-i18n="site_link">Learning site ↗</a>
    <span class="chip" id="conn"><span class="dot"></span><span>connecting…</span></span>
  </header>
  <div id="failure" class="card failure" hidden></div>
  <section class="card now" id="now"></section>
  <h2 data-i18n="h_overview">Overview</h2>
  <div class="tiles" id="tiles"></div>
  <h2 data-i18n="h_documents">Documents</h2>
  <div class="card drop" id="drop">
    <input type="file" id="pick" accept=".pdf,application/pdf" multiple hidden>
    <div data-i18n="drop"></div>
    <ul class="uploads" id="uploads"></ul>
  </div>
  <div id="docs"></div>
  <h2 data-i18n="h_curriculum">Curriculum</h2>
  <div class="card">
    <div class="legend" style="margin-bottom:12px">
      <span><i style="background:var(--note-soft)"></i><span data-i18n="leg_page">topic page</span></span>
      <span><i style="background:var(--good-soft)"></i><span data-i18n="leg_lesson">+ lesson</span></span>
      <span><i style="background:var(--good)"></i><span data-i18n="leg_quiz">+ quiz</span></span>
      <span><i style="border:1px dashed var(--bad)"></i><span data-i18n="leg_missing">listed, no page yet</span></span>
    </div>
    <div id="curriculum"></div>
  </div>
  <div class="cols">
    <div><h2 data-i18n="h_activity">Activity</h2><div class="card"><ul class="feed" id="feed"></ul></div></div>
    <div><h2><span data-i18n="h_health">Health</span> <span class="muted" id="health-sum"></span></h2>
      <div class="card">
        <div class="tabs" id="tabs">
          <button data-tab="errors" aria-pressed="true" data-i18n="tab_errors">Errors</button>
          <button data-tab="warnings" aria-pressed="false" data-i18n="tab_warnings">Warnings</button>
        </div>
        <ul class="issues" id="issues"></ul>
      </div>
    </div>
  </div>
</main>
<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const STALE_MIN = 30;  // a step older than this isn't "now" any more
let state = null, prev = null, tab = "errors", conn = ["", "connecting"];

// Interface strings. A function takes the values it shows; a key missing from a language falls back to English.
const STR = {
  en: {
    title: "Knowledge base admin", site_link: "Learning site ↗", switch_to: "Przełącz na polski",
    h_overview: "Overview", h_documents: "Documents", h_curriculum: "Curriculum", h_activity: "Activity", h_health: "Health",
    tab_errors: "Errors", tab_warnings: "Warnings",
    connecting: "connecting…", live: "live", updated: (t) => `live · updated ${t}`, offline: "disconnected, retrying…",
    started: (a) => `started ${a}`, part_of: (n, total) => `part ${n}${total ? ` of ${total}` : ""}`, idle: "Idle",
    last_step: (m, a) => `last step “${m}” ${a}`,
    no_steps: "no build steps recorded yet. Run <code>/ingest</code> and progress appears here.",
    written: (a, b) => `${a} file(s) written in the last 10 min, ${b} in the last hour`,
    docs_built: "Documents built", converted_n: (n) => `${n} converted`, concepts: "Concepts", wiki_pages: "pages in the wiki",
    topics: "Topics", placed: (p, m) => `${p} placed in ${m} modules`, lessons: "Lessons", with_lesson: "topics with a lesson",
    quizzes: "Quizzes", with_quiz: "topics with a quiz", errors: "Errors", n_warnings: (n) => `${n} warning(s)`,
    drop: `<strong>Add PDFs to <code>library/</code></strong>: drop them here or
      <button type="button" class="linkbtn" id="pick-btn">choose files</button>.
      <span class="muted">Then run <code>/ingest</code> in Claude Code.</span>`,
    no_pdfs: "No PDFs in <code>library/</code> yet.",
    no_kb: "No <code>kb/</code> on this branch. Switch to a learning branch, or add PDFs and run <code>/ingest</code>.",
    b_unconverted: "not converted: run /ingest", b_converted: "converted", b_outline: "outline",
    scanned: (n) => `${n} scanned page(s)`, tr_pending: "scanned: transcription pending", tr_transcribed: "scanned: transcribed",
    tr_ocr: "scanned: OCR kept", b_source: "source page", b_wiki_built: "wiki built", b_wiki_pending: "wiki pending",
    b_removed: "removed from library", pages: (n) => `${n} pages`, lines: (s) => `${s} lines`, converted_ago: (a) => `converted ${a}`,
    part_title: (n, a, b, s) => `Part ${n}: lines ${a}–${b}, starts at “${s}”`,
    part_skipped: "skipped on purpose, left out of coverage", part_cited: (c, h, p) => `${c} of ${h} headings cited (${p}%)`,
    doc_cited: (c, h, p, sk) => `${c} of ${h} headings cited by wiki pages (${p}%)${sk ? `, not counting ${sk} skipped part(s)` : ""}`,
    leg_page: "topic page", leg_lesson: "+ lesson", leg_quiz: "+ quiz", leg_missing: "listed, no page yet",
    leg_fill: "fill = headings cited", leg_read: "read", leg_reading: "reading now", leg_skipped: "skipped",
    concepts_n: (n) => `${n} concept(s)`, topics_n: (n) => `${n} topic(s)`,
    unplaced: "Not in the curriculum", unplaced_sub: "topic pages with no module yet",
    no_curriculum: "No curriculum yet. It appears once topics are written.",
    skipped: "(skipped)", part_n: (n) => `part ${n}`, new: "new", nothing: "Nothing yet.",
    health_sum: (e, w) => `· ${e} error(s), ${w} warning(s)`,
    more: (n) => `… and ${n} more (run <code>uv run learnkb-check</code>)`,
    none_errors: "None. The wiki validates.", none_warnings: "None.",
    failure: "Couldn't read the knowledge base (probably a file mid-write; retrying on the next change):",
    uploading: "uploading…", not_pdf: "not a PDF, skipped", already: "already in library/, skipped",
    added: (p) => `added as ${p}`, failed: (s) => `failed (HTTP ${s})`, net: "upload failed: is learnkb-serve still running?",
    "err:host": "uploads are only accepted from localhost", "err:type": "expected Content-Type: application/pdf",
    "err:main": "main holds no subject content: switch to a learn/<subject> branch first",
    "err:name": "expected a .pdf file name", "err:size": (j) => `empty or larger than ${j.max_mb} MB`,
    "err:exists": "already in library/", "err:short": "upload cut short", "err:notpdf": "not a PDF file",
  },
  pl: {
    title: "Panel bazy wiedzy", site_link: "Strona nauki ↗", switch_to: "Switch to English",
    h_overview: "Przegląd", h_documents: "Dokumenty", h_curriculum: "Program", h_activity: "Aktywność", h_health: "Stan",
    tab_errors: "Błędy", tab_warnings: "Ostrzeżenia",
    connecting: "łączenie…", live: "na żywo", updated: (t) => `na żywo · aktualizacja ${t}`, offline: "rozłączono, ponawiam…",
    started: (a) => `rozpoczęto ${a}`, part_of: (n, total) => `część ${n}${total ? ` z ${total}` : ""}`, idle: "Bezczynny",
    last_step: (m, a) => `ostatni krok „${m}” ${a}`,
    no_steps: "nie zapisano jeszcze żadnych kroków budowania. Uruchom <code>/ingest</code>, a postęp pojawi się tutaj.",
    written: (a, b) => `zapisane pliki: ${a} w ostatnich 10 min, ${b} w ostatniej godzinie`,
    docs_built: "Zbudowane dokumenty", converted_n: (n) => `przekonwertowane: ${n}`, concepts: "Pojęcia", wiki_pages: "strony w wiki",
    topics: "Tematy", placed: (p, m) => `${p} w programie (modułów: ${m})`, lessons: "Lekcje", with_lesson: "tematy z lekcją",
    quizzes: "Quizy", with_quiz: "tematy z quizem", errors: "Błędy", n_warnings: (n) => `ostrzeżenia: ${n}`,
    drop: `<strong>Dodaj PDF-y do <code>library/</code></strong>: upuść je tutaj albo
      <button type="button" class="linkbtn" id="pick-btn">wybierz pliki</button>.
      <span class="muted">Potem uruchom <code>/ingest</code> w Claude Code.</span>`,
    no_pdfs: "Brak PDF-ów w <code>library/</code>.",
    no_kb: "Na tym branchu nie ma <code>kb/</code>. Przełącz się na branch nauki albo dodaj PDF-y i uruchom <code>/ingest</code>.",
    b_unconverted: "nieprzekonwertowany: uruchom /ingest", b_converted: "przekonwertowany", b_outline: "konspekt",
    scanned: (n) => `zeskanowane strony: ${n}`, tr_pending: "skan: czeka na transkrypcję", tr_transcribed: "skan: przepisany",
    tr_ocr: "skan: zostawiono OCR", b_source: "strona źródła", b_wiki_built: "wiki zbudowane", b_wiki_pending: "wiki w toku",
    b_removed: "usunięty z biblioteki", pages: (n) => `stron: ${n}`, lines: (s) => `wierszy: ${s}`,
    converted_ago: (a) => `przekonwertowano ${a}`,
    part_title: (n, a, b, s) => `Część ${n}: wiersze ${a}–${b}, zaczyna się od „${s}”`,
    part_skipped: "pominięta celowo, nie wlicza się do pokrycia",
    part_cited: (c, h, p) => `cytowane nagłówki: ${c} z ${h} (${p}%)`,
    doc_cited: (c, h, p, sk) => `nagłówki cytowane przez strony wiki: ${c} z ${h} (${p}%)${sk ? `, bez pominiętych części (${sk})` : ""}`,
    leg_page: "strona tematu", leg_lesson: "+ lekcja", leg_quiz: "+ quiz", leg_missing: "w programie, bez strony",
    leg_fill: "wypełnienie = cytowane nagłówki", leg_read: "przeczytana", leg_reading: "czytana teraz", leg_skipped: "pominięta",
    concepts_n: (n) => `pojęcia: ${n}`, topics_n: (n) => `tematy: ${n}`,
    unplaced: "Poza programem", unplaced_sub: "strony tematów bez modułu",
    no_curriculum: "Programu jeszcze nie ma. Pojawi się, gdy powstaną tematy.",
    skipped: "(pominięto)", part_n: (n) => `część ${n}`, new: "nowy", nothing: "Na razie nic.",
    health_sum: (e, w) => `· błędy: ${e}, ostrzeżenia: ${w}`,
    more: (n) => `… i jeszcze ${n} (uruchom <code>uv run learnkb-check</code>)`,
    none_errors: "Brak. Wiki przechodzi walidację.", none_warnings: "Brak.",
    failure: "Nie udało się odczytać bazy wiedzy (pewnie plik jest w trakcie zapisu; ponowię przy następnej zmianie):",
    uploading: "wysyłanie…", not_pdf: "to nie PDF, pominięto", already: "już jest w library/, pominięto",
    added: (p) => `dodano jako ${p}`, failed: (s) => `błąd (HTTP ${s})`, net: "wysyłanie nie powiodło się: czy learnkb-serve nadal działa?",
    "err:host": "pliki można dodawać tylko z localhost", "err:type": "oczekiwano Content-Type: application/pdf",
    "err:main": "main nie zawiera treści przedmiotu: najpierw przełącz się na branch learn/<przedmiot>",
    "err:name": "oczekiwano nazwy pliku .pdf", "err:size": (j) => `pusty albo większy niż ${j.max_mb} MB`,
    "err:exists": "już jest w library/", "err:short": "wysyłanie przerwane", "err:notpdf": "to nie jest plik PDF",
    "phase:parse": "parsowanie", "phase:transcribe": "transkrypcja", "phase:read": "czytanie", "phase:source": "źródło",
    "phase:concepts": "pojęcia", "phase:topics": "tematy", "phase:curriculum": "program", "phase:check": "kontrola",
    "phase:done": "gotowe",
  },
};
const LANG_KEY = "learnkb-admin-lang";
const stored = () => { try { return localStorage.getItem(LANG_KEY); } catch { return null; } };
// The viewer's choice, else the knowledge base's language (kb/site.json), else the browser's.
const pickLang = (kbLang) => [stored(), kbLang, navigator.language.slice(0, 2)].find((l) => l in STR) || "en";
let lang = pickLang(null);

function t(key, ...args) {
  const v = STR[lang][key] ?? STR.en[key] ?? (key.startsWith("phase:") ? key.slice(6) : key);
  return typeof v === "function" ? v(...args) : v;
}

function ago(iso) {
  const s = Math.max(0, (Date.now() - new Date(iso)) / 1000);
  const rtf = new Intl.RelativeTimeFormat(lang, { numeric: "always", style: "short" });
  if (s < 60) return rtf.format(-Math.round(s), "second");
  if (s < 3600) return rtf.format(-Math.round(s / 60), "minute");
  if (s < 86400) return rtf.format(-Math.round(s / 3600), "hour");
  return rtf.format(-Math.round(s / 86400), "day");
}
const clock = (iso) => new Date(iso).toLocaleTimeString(lang, { hour: "2-digit", minute: "2-digit", second: "2-digit" });
const pct = (a, b) => (b ? Math.round((100 * a) / b) : 0);

function renderNow(d) {
  const step = d.steps?.at(-1);
  const active = step && step.phase !== "done" && (Date.now() - new Date(step.at)) / 60000 < STALE_MIN;
  const idx = active ? d.phases.indexOf(step.phase) : -1;
  const stepper = d.phases.map((p, i) =>
    `<span class="${i < idx ? "past" : i === idx ? "current" : ""}">${esc(t(`phase:${p}`))}</span>`).join("");
  let line;
  if (active) {
    const doc = d.documents?.find((x) => x.slug === step.doc);
    const total = doc?.plan?.parts.length;
    line = `<strong>${esc(step.message || t(`phase:${step.phase}`))}</strong>
      ${step.doc ? `<span class="chip">${esc(step.doc)}${step.part ? ` · ${t("part_of", step.part, total)}` : ""}</span>` : ""}
      <span class="muted">${t("started", ago(step.at))}</span>`;
  } else if (step) {
    line = `<strong>${t("idle")}</strong> <span class="muted">${t("last_step", esc(step.message || t(`phase:${step.phase}`)), ago(step.at))}</span>`;
  } else {
    line = `<strong>${t("idle")}</strong> <span class="muted">${t("no_steps")}</span>`;
  }
  const w = d.written ? `<span class="muted">${t("written", d.written["10m"], d.written["60m"])}</span>` : "";
  $("now").innerHTML = `<div class="now-line">${line}</div><div class="stepper">${stepper}</div>${w}`;
}

function tile(label, n, sub, frac, cls = "") {
  return `<div class="card tile ${cls}"><div class="label">${label}</div><div class="n">${n}</div>
    ${sub ? `<div class="sub">${sub}</div>` : ""}${frac != null ? `<div class="bar"><i style="width:${frac}%"></i></div>` : ""}</div>`;
}

function renderTiles(d) {
  const c = d.counts, docs = (d.documents || []).filter((x) => !x.removed), h = d.health;
  const built = docs.filter((x) => x.wiki_built).length;
  $("tiles").innerHTML = [
    tile(t("docs_built"), `${built}/${docs.length}`, t("converted_n", docs.filter((x) => x.plan).length), pct(built, docs.length)),
    tile(t("concepts"), c.concepts, t("wiki_pages")),
    tile(t("topics"), c.topics, t("placed", c.placed, c.modules), pct(c.placed, c.topics)),
    tile(t("lessons"), `${c.lessons}/${c.topics}`, t("with_lesson"), pct(c.lessons, c.topics)),
    tile(t("quizzes"), `${c.quizzes}/${c.topics}`, t("with_quiz"), pct(c.quizzes, c.topics)),
    tile(t("errors"), h.n_errors, t("n_warnings", h.n_warnings), null, h.n_errors ? "bad" : "ok"),
  ].join("");
}

function renderDocs(d) {
  const step = d.steps?.at(-1);
  const docs = d.documents || [];
  if (!docs.length) { $("docs").innerHTML = `<div class="card empty">${t("no_pdfs")}</div>`; return; }
  $("docs").innerHTML = docs.map((doc) => {
    const p = doc.plan;
    const reading = step && step.phase === "read" && !step.skipped && step.doc === doc.slug ? step.part : null;
    const badges = [
      doc.unconverted ? `<span class="badge now">${t("b_unconverted")}</span>` : `<span class="badge yes">${t("b_converted")}</span>`,
      p ? `<span class="badge ${p.outline ? "yes" : ""}">${t("b_outline")}</span>` : "",
      doc.transcription ? `<span class="badge ${doc.transcription === "pending" ? "now" : "yes"}" title="${esc(t("scanned", doc.scanned_pages))}">${
        {pending: t("tr_pending"), transcribed: t("tr_transcribed"), ocr: t("tr_ocr")}[doc.transcription] || esc(doc.transcription)}</span>` : "",
      doc.slug ? `<span class="badge ${doc.source_page ? "yes" : ""}">${t("b_source")}</span>` : "",
      doc.slug ? `<span class="badge ${doc.wiki_built ? "yes" : "now"}">${doc.wiki_built ? t("b_wiki_built") : t("b_wiki_pending")}</span>` : "",
      doc.removed ? `<span class="badge">${t("b_removed")}</span>` : "",
    ].join(" ");
    const meta = [doc.pages && t("pages", doc.pages), p && t("lines", p.lines.toLocaleString(lang)), p && `${p.kb} KB`,
                  doc.converted_at && t("converted_ago", ago(doc.converted_at))].filter(Boolean).join(" · ");
    const parts = p ? `<div class="parts">${p.parts.map((x) => {
        const cov = pct(x.cited, x.headings);
        const cls = x.n === reading ? "reading" : x.status || "";
        const note = x.status === "skipped" ? t("part_skipped") : t("part_cited", x.cited, x.headings, cov);
        return `<div class="part ${cls}" title="${esc(t("part_title", x.n, x.lines[0], x.lines[1], x.starts))}\n${note}">
          <div class="fill" style="height:${cov}%"></div><span>${x.n}</span></div>`;
      }).join("")}</div>
      <div class="legend"><span>${t("doc_cited", p.cited, p.headings, pct(p.cited, p.headings), p.skipped)}</span>
        <span><i style="background:var(--accent);opacity:.55"></i>${t("leg_fill")}</span>
        <span><i style="border:2px solid var(--good)"></i>${t("leg_read")}</span>
        <span><i style="border:2px solid var(--accent)"></i>${t("leg_reading")}</span>
        <span><i style="border:2px dashed var(--muted)"></i>${t("leg_skipped")}</span></div>` : "";
    return `<div class="card doc"><div class="doc-head"><strong>${esc(doc.title)}</strong>
      <code class="muted">${esc(doc.file)}</code>${badges}</div>
      <div class="muted" style="font-size:13px">${meta}</div>${parts}</div>`;
  }).join("");
}

function renderCurriculum(d) {
  const before = new Map();
  prev?.curriculum?.modules.flatMap((m) => m.topics).concat(prev.curriculum.unplaced)
    .forEach((x) => before.set(x.slug, `${x.page}${x.lesson}${x.quiz}`));
  const chip = (x) => {
    const cls = !x.page ? "missing" : x.quiz ? "quiz" : x.lesson ? "lesson" : "page";
    const changed = prev && before.get(x.slug) !== `${x.page}${x.lesson}${x.quiz}`;
    return `<span class="topic ${cls}${changed ? " flash" : ""}" title="${esc(x.slug)} · ${t("concepts_n", x.concepts)}">${esc(x.title)}</span>`;
  };
  const cur = d.curriculum;
  const rows = cur.modules.map((m) => `<div class="module"><div><div class="title">${esc(m.title)}</div>
      <div class="muted" style="font-size:12px">${t("topics_n", m.topics.length)}</div></div>
      <div class="topics">${m.topics.map(chip).join("")}</div></div>`);
  if (cur.unplaced.length) rows.push(`<div class="module"><div><div class="title">${t("unplaced")}</div>
      <div class="muted" style="font-size:12px">${t("unplaced_sub")}</div></div>
      <div class="topics">${cur.unplaced.map(chip).join("")}</div></div>`);
  $("curriculum").innerHTML = rows.join("") || `<div class="empty">${t("no_curriculum")}</div>`;
}

function renderFeed(d) {
  const seen = new Set((prev?.files || []).map((f) => f.path + f.at));
  const items = [
    ...(d.steps || []).map((s) => ({ at: s.at, html: `<span class="phase">${esc(t(`phase:${s.phase}`))}</span>${esc(s.message || "")}${s.skipped ? ` <span class="muted">${t("skipped")}</span>` : ""}${s.doc ? ` <span class="muted">${esc(s.doc)}${s.part ? ` · ${t("part_n", s.part)}` : ""}</span>` : ""}` })),
    ...(d.files || []).map((f) => ({ at: f.at, fresh: prev && !seen.has(f.path + f.at),
      html: `${f.created ? `<span class="new">${t("new")}</span>` : ""}<code>${esc(f.path)}</code>` })),
  ].sort((a, b) => new Date(b.at) - new Date(a.at)).slice(0, 80);
  $("feed").innerHTML = items.map((i) => `<li class="${i.fresh ? "fresh" : ""}"><time title="${esc(i.at)}">${clock(i.at)}</time><div>${i.html}</div></li>`).join("")
    || `<li class="empty">${t("nothing")}</li>`;
}

function renderHealth(d) {
  const h = d.health;
  $("health-sum").textContent = t("health_sum", h.n_errors, h.n_warnings);
  document.querySelectorAll("#tabs button").forEach((b) => b.setAttribute("aria-pressed", b.dataset.tab === tab));
  const list = h[tab], total = tab === "errors" ? h.n_errors : h.n_warnings;
  $("issues").innerHTML = list.map((m) => `<li class="${tab === "errors" ? "error" : ""}">${esc(m)}</li>`).join("")
    + (total > list.length ? `<li class="muted">${t("more", total - list.length)}</li>` : "")
    || `<li class="empty" style="border:0">${tab === "errors" ? t("none_errors") : t("none_warnings")}</li>`;
}

function render(d) {
  $("branch").hidden = !d.branch;
  $("branch").textContent = d.branch ? `⎇ ${d.branch}` : "";
  $("failure").hidden = !d.failure;
  if (d.failure) $("failure").textContent = `${t("failure")}\n${d.failure}`;
  renderNow(d);
  if (!d.kb) {
    $("tiles").innerHTML = ""; $("curriculum").innerHTML = ""; $("feed").innerHTML = "";
    if (d.documents?.length) renderDocs(d);
    else $("docs").innerHTML = `<div class="card empty">${t("no_kb")}</div>`;
    return;
  }
  if (d.failure) return;  // keep the last good view
  renderTiles(d); renderDocs(d); renderCurriculum(d); renderFeed(d); renderHealth(d);
  prev = d;
}

function applyLang(next) {
  lang = next;
  document.documentElement.lang = lang;
  document.title = t("title");
  document.querySelectorAll("[data-i18n]").forEach((el) => { el.innerHTML = t(el.dataset.i18n); });
  $("lang").textContent = lang === "pl" ? "EN" : "PL";
  $("lang").title = t("switch_to");
  setConn(...conn);
  if (state) render(state);
}

$("lang").addEventListener("click", () => {
  const next = lang === "pl" ? "en" : "pl";
  try { localStorage.setItem(LANG_KEY, next); } catch {}
  applyLang(next);
});

$("tabs").addEventListener("click", (e) => {
  if (!e.target.dataset.tab) return;
  tab = e.target.dataset.tab;
  if (state?.health) renderHealth(state);
});

async function upload(files) {
  const have = new Set((state?.documents || []).filter((x) => !x.removed).map((x) => x.file.normalize("NFC")));
  for (const f of files) {
    const li = document.createElement("li");
    li.innerHTML = `<code>${esc(f.name)}</code> <span class="muted">${t("uploading")}</span>`;
    $("uploads").append(li);
    const status = li.lastElementChild;
    const done = (cls, msg) => { status.className = cls; status.textContent = msg; };
    if (!/\.pdf$/i.test(f.name)) { done("bad", t("not_pdf")); continue; }
    if (have.has(f.name.normalize("NFC"))) { done("bad", t("already")); continue; }
    try {
      const r = await fetch(`api/upload?name=${encodeURIComponent(f.name)}`,
                            { method: "POST", headers: { "Content-Type": "application/pdf" }, body: f });
      const j = await r.json().catch(() => ({}));
      if (r.ok) done("ok", t("added", j.saved));
      else done("bad", `err:${j.code}` in STR.en ? t(`err:${j.code}`, j) : j.error || t("failed", r.status));
    } catch {
      done("bad", t("net"));
    }
  }
}

const drop = $("drop");
["dragenter", "dragover"].forEach((ev) => drop.addEventListener(ev, (e) => { e.preventDefault(); drop.classList.add("over"); }));
drop.addEventListener("dragleave", (e) => { if (!drop.contains(e.relatedTarget)) drop.classList.remove("over"); });
drop.addEventListener("drop", (e) => { e.preventDefault(); drop.classList.remove("over"); upload([...e.dataTransfer.files]); });
// A PDF dropped just outside the zone would otherwise replace the panel with the PDF.
["dragover", "drop"].forEach((ev) => window.addEventListener(ev, (e) => e.preventDefault()));
// The button is re-created when the language changes, so listen on the zone.
drop.addEventListener("click", (e) => { if (e.target.id === "pick-btn") $("pick").click(); });
$("pick").addEventListener("change", (e) => { upload([...e.target.files]); e.target.value = ""; });

function setConn(cls, key, ...args) {
  conn = [cls, key, ...args];
  $("conn").className = `chip ${cls}`;
  $("conn").lastElementChild.textContent = t(key, ...args);
}
function connect() {
  const es = new EventSource("api/events")  // relative: the panel lives under /admin/;
  es.onopen = () => setConn("live", "live");
  es.onmessage = (e) => {
    state = JSON.parse(e.data);
    const want = pickLang(state.lang);
    if (want !== lang) applyLang(want); else render(state);
    setConn("live", "updated", clock(state.generated_at));
  };
  es.onerror = () => setConn("offline", "offline");  // EventSource reconnects by itself
}
applyLang(lang);
connect();
setInterval(() => state && renderNow(state), 5000);  // keep the "x ago" labels fresh
</script>
</body>
</html>
